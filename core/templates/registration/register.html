{% extends "base.html" %}

{% block title %}Registrieren &ndash; Learning Companion{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-sm-10 col-md-8 col-lg-6 col-xl-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <span class="lc-icon-circle bg-success-subtle text-success-emphasis mb-3"><i class="bi bi-person-plus" aria-hidden="true"></i></span>
                        <h1 class="h3 mb-1">Registrieren</h1>
                        <p class="text-body-secondary small mb-0">Lege ein Konto an, um deine Lernziele zu verfolgen.</p>
                    </div>

                    <form method="post">
                        {% csrf_token %}
                        {% include "core/_form.html" %}
                        <button type="submit" class="btn btn-success w-100 mt-2">Konto anlegen</button>
                    </form>
                </div>
                <div class="card-footer bg-body-tertiary text-center small py-3">
                    Bereits registriert? <a href="{% url 'core:login' %}">Zum Login</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
