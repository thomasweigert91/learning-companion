<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Learning Companion{% endblock %}</title>
    <style>
        /* Minimale Typ-Badges fuer Ressourcen -- bewusst ohne CSS-Framework. */
        .badge {
            display: inline-block;
            padding: 0.1em 0.5em;
            border-radius: 0.8em;
            font-size: 0.8em;
            color: #fff;
        }
        .badge-article { background: #2b6cb0; }
        .badge-video   { background: #c53030; }
        .badge-repo    { background: #2f855a; }
        .badge-doc     { background: #6b46c1; }
    </style>
</head>
<body>
<header>
    <nav>
        <a href="{% url 'core:home' %}">Learning Companion</a>
        {% if user.is_authenticated %}
            <a href="{% url 'core:goal_list' %}">Goals</a>
            <a href="{% url 'core:session_list' %}">Sessions</a>
            <a href="{% url 'core:profile_detail' %}">Mein Profil</a>
            <span>Angemeldet als {{ user.get_username }}</span>
            {# Django 5: Logout erfordert einen POST. #}
            <form action="{% url 'core:logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'core:login' %}">Login</a>
            <a href="{% url 'core:register' %}">Registrieren</a>
        {% endif %}
    </nav>
</header>

<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
