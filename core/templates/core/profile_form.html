{% extends "base.html" %}

{% block title %}Profil bearbeiten &ndash; Learning Companion{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-body py-3">
                    <h1 class="h4 mb-0"><i class="bi bi-person-gear text-primary me-2" aria-hidden="true"></i>Profil bearbeiten</h1>
                </div>
                <form method="post">
                    <div class="card-body p-4">
                        {% csrf_token %}
                        {% include "core/_form.html" %}
                    </div>
                    <div class="card-footer bg-body-tertiary d-flex justify-content-end gap-2 py-3">
                        <a class="btn btn-outline-secondary" href="{% url 'core:profile_detail' %}">Abbrechen</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Speichern
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
