{% extends "base.html" %}

{% block title %}Profil bearbeiten &ndash; Learning Companion{% endblock %}

{% block content %}
    <h1>Profil bearbeiten</h1>

    {% if form.errors %}
        <div class="errors">
            <p>Bitte korrigiere die folgenden Eingaben:</p>
            {{ form.errors }}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Speichern</button>
    </form>

    <a href="{% url 'core:profile_detail' %}">Abbrechen</a>
{% endblock %}
