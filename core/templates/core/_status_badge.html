{# Erwartet "status" (Rohwert) und "label" (Anzeige). Die Farbe ist nie der einzige Informationstraeger -- der Text steht immer mit im Badge. #}
{% if status == "done" %}
    <span class="badge rounded-pill text-bg-success"><i class="bi bi-check-circle-fill me-1" aria-hidden="true"></i>{{ label }}</span>
{% elif status == "in-progress" %}
    <span class="badge rounded-pill text-bg-primary"><i class="bi bi-play-circle-fill me-1" aria-hidden="true"></i>{{ label }}</span>
{% else %}
    <span class="badge rounded-pill text-bg-secondary"><i class="bi bi-circle me-1" aria-hidden="true"></i>{{ label }}</span>
{% endif %}
